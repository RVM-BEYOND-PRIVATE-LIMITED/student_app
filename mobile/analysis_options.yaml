# The Flutter lint set, as the Team app uses it, plus a few rules that keep
# this code base consistent.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/l10n/gen/**
    # Vendored, unchanged copies of team_app core packages (mobile/packages/
    # VENDORED.md). Their own lint set belongs to team_app.
    - packages/**

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
