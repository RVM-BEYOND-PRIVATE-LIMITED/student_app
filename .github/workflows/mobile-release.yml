name: mobile-release

# #73 — a hand-run (or version-tag) signed prod AAB for Google Play.
# The upload keystore lives only in repository secrets; this workflow never
# falls back to the debug key and never prints a secret value.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Require every signing secret
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE" ] || missing+=("ANDROID_UPLOAD_KEYSTORE_B64")
          [ -n "$STORE_PASSWORD" ] || missing+=("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("ANDROID_UPLOAD_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("ANDROID_UPLOAD_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing signing secret(s): ${missing[*]}. A release is never signed with the debug key."
            exit 1
          fi

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        working-directory: .
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Check the Flutter version
        run: |
          flutter config --no-analytics
          flutter --version --machine \
            | grep -q "\"frameworkVersion\": \"$FLUTTER_VERSION\""

      - name: Get packages
        run: flutter pub get

      - name: Generated client drift
        run: bash tool/generate_student_api.sh --check

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build the signed prod AAB and pilot APK
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: bash tool/build_release.sh

      - name: Release check
        run: |
          dart run tool/check_release.dart \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Prove the upload key signed it (not the debug key)
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/cert.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/cert.txt"; then
            echo "::error::The APK is debug-signed; refusing to publish it."
            exit 1
          fi
          {
            echo '### Release certificate'
            echo '```'
            cat "$RUNNER_TEMP/cert.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the Play bundle and pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: student-app-${{ github.ref_name }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/symbols/**
          if-no-files-found: error
          retention-days: 30
