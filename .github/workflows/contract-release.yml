name: contract-release

# Each contract version reaching main becomes a GitHub release (student_app #14), so the app and
# the web version can pin one version, and the rendered page (student_app #16) goes with it.
#
#   tag        contract-v<info.version>, for example contract-v0.26.0
#   assets     openapi.yaml (the file as published), openapi.json (bundled), student-api.html
#              (the contract rendered as one page by Redocly)
#   notes      the version's section of packages/openapi/CHANGELOG.md
#
# A version already released is left as it is: a push that does not raise info.version makes no
# release. It needs no secret beyond the workflow's own token.
on:
  push:
    branches: [main]
    paths:
      - 'packages/openapi/openapi.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contract-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version and release state
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -E '^  version:' packages/openapi/openapi.yaml | sed -E "s/^  version:\s*['\"]?([0-9.]+)['\"]?\s*$/\1/")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "contract-v$version" >/dev/null 2>&1; then
            echo "Contract $version is already released."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the assets
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cp packages/openapi/openapi.yaml dist/openapi.yaml
          npx --yes @redocly/cli@1.34.5 bundle --ext json packages/openapi/openapi.yaml -o dist/openapi.json
          npx --yes @redocly/cli@1.34.5 build-docs packages/openapi/openapi.yaml -o dist/student-api.html
          node packages/openapi/tools/changelog-section.mjs "${{ steps.v.outputs.version }}" > dist/notes.md

      - name: Release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "contract-v${{ steps.v.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "Student API contract ${{ steps.v.outputs.version }}" \
            --notes-file dist/notes.md \
            dist/openapi.yaml dist/openapi.json dist/student-api.html
