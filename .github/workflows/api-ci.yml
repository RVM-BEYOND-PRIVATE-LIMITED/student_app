name: api-ci
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/openapi/**'
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm openapi:build && git diff --exit-code packages/openapi/openapi.yaml
      - name: migration lint
        run: |
          # No writes outside lms/lms_bridge/lms_jobs; no unsafe locks
          ! grep -rinE 'create|alter|drop' apps/api/migrations --include='*.sql' | grep -viE 'lms|lms_bridge|lms_jobs|lock_timeout' || true
          grep -rin 'lock_timeout' apps/api/migrations --include='*.sql'
