name: secret-scan

# Scheduler_Backend #139 item 4: no private key, live key, service-role key, cloud or GitHub token, password hash,
# database dump rows or tracked .env file in this repository. The same scan as Scheduler_Backend and
# Scheduler_frontend (scripts/secretScan.cjs). It prints the file, the line and the rule only, never the value.
# Known files are on scripts/secretScan.allow.json, each with its reason.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan the tracked tree for secrets
        run: node scripts/secretScan.cjs
