name: mobile-ci

# The student app in mobile/ (student_app #1, item 13).
#
# Runs on every pull request that touches mobile/, whatever branch it
# targets. It never runs on a push, never signs a release with a real key
# and never uploads an APK or a bundle: the release builds below exist only
# to check and measure them (student_app #8, items 5 and 6).
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The one Flutter version the app is built with (mobile/README.md).
  FLUTTER_VERSION: '3.35.7'

jobs:
  mobile:
    # Golden images are made on Linux; keep the runner's OS fixed.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # No iOS target is built or published, and no web or desktop app
      # either (student_app #8, item 13): fails when mobile/ grows another
      # platform folder, or .metadata lists one.
      - name: Android only
        run: bash tool/android_only.sh

      # No AI doubt solver, AI counsellor, AI mock interview or resume
      # builder (student_app #9): fails when pubspec.yaml or pubspec.lock
      # lists a generative-AI SDK, or a route in lib/router/ or a key or text
      # in lib/l10n/*.arb names one of those features.
      - name: No AI features
        run: bash tool/no_ai_features.sh

      # Flutter comes from its own repository at the release tag: no
      # third-party setup action.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        working-directory: .
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          # The Android build needs JDK 17, which the runner image carries.
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Check the Flutter version
        run: |
          flutter config --no-analytics
          flutter --version
          flutter --version --machine \
            | grep -q "\"frameworkVersion\": \"$FLUTTER_VERSION\""

      - name: Get packages
        run: flutter pub get

      # gen-l10n lists every key a language lacks in
      # build/untranslated_messages.json (l10n.yaml). Any entry fails the
      # build: a Hindi screen must never fall back to English. A key that
      # exists only in Hindi fails it too.
      - name: Missing translations
        run: |
          flutter gen-l10n
          report=build/untranslated_messages.json
          test -f "$report"
          if [ "$(tr -d '[:space:]' < "$report")" != "{}" ]; then
            echo "::error file=mobile/lib/l10n/app_hi.arb::Untranslated messages (see below)"
            cat "$report"
            exit 1
          fi
          keys() { jq -r 'keys[] | select(startswith("@") | not)' "$1" | sort; }
          if ! diff <(keys lib/l10n/app_en.arb) <(keys lib/l10n/app_hi.arb); then
            echo "::error file=mobile/lib/l10n/app_hi.arb::app_en.arb and app_hi.arb must hold the same keys"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags golden

      # Golden images of the shared states in English, Hindi and the
      # long-text pseudo-locale (student_app #11), drawn with the bundled
      # fonts. Remake them on Linux with
      #   flutter test --tags golden --update-goldens
      - name: Golden tests
        run: flutter test --tags golden

      - name: Keep the golden differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: mobile/test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 7

      # The release builds as they would ship (student_app #8, items 5 and
      # 6): prod (FLAVOR=prod), R8-shrunk and obfuscated: the App Bundle,
      # the universal pilot APK and one APK per ABI, with their Dart symbol
      # files, Dart obfuscation maps and R8 mapping written to
      # build/symbols/ (tool/build_release.sh). For checking and size only. There is no
      # release key in this repository: the signing key and the application
      # id are permanent choices made under student_app #20.
      # RVM_CI_SIZE_REPORT signs these builds with the runner's throwaway
      # debug key (android/app/build.gradle.kts); they are checked, measured,
      # then deleted with the runner, symbol files included, since no one
      # ever runs them.
      - name: Release builds (check and size only)
        env:
          RVM_CI_SIZE_REPORT: 'true'
        run: bash tool/build_release.sh

      # A prod build (no Developer menu or test switch), target API level,
      # not debuggable, cleartext off, every exported component reviewed
      # (the bundle's base manifest too), R8's mapping inside the bundle, and
      # no keystore, signing file, .env, google-services.json,
      # service-account JSON, .pem, .key or private key inside
      # (tool/check_release.dart).
      - name: Release check
        run: |
          dart run tool/check_release.dart \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-*-release.apk

      # A report, not a gate: no size budget is agreed yet (student_app #13).
      - name: Size report
        run: |
          dart run tool/size_report.dart > "$RUNNER_TEMP/size.md"
          cat "$RUNNER_TEMP/size.md"
          cat "$RUNNER_TEMP/size.md" >> "$GITHUB_STEP_SUMMARY"
