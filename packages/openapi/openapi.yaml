  /v1/playback/sessions:
    post:
      tags: [videos]
      operationId: startPlayback
      summary: Start playing a video
      description: |
        Checks access in this order: linked admission, full fee paid, the course is mine (or the recording
        is my batch's), access not ended (6 months after the course end), a view left. Then the device
        (the bound phone, or my one web session) and one open playback at a time. Returns a playback token
        for this session only, with a moving watermark set by the server and no offline copy. A view is
        counted once 5% is watched; reopening within 60 minutes of a counted session does not count again.
      x-status: live
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybackStart' }
            examples:
              one: { value: { video_id: 3f0c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
      responses:
        '201':
          description: Started.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackStarted' }
              examples:
                one: { value: { session_id: 7a1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b, otp: 'example-otp', playback_info: 'example-info', heartbeat_seconds: 15, resumed: false, views_left: 1, expires_in: 300 } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: No such published video.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: NOT_FOUND, message: 'Not found.', details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '409':
          description: '`NOT_LINKED`, `FEE_PENDING`, `NOT_YOUR_COURSE`, `ACCESS_ENDED`, `NO_VIEWS_LEFT`, `DEVICE_NOT_TRUSTED` or `SESSION_ALREADY_OPEN`.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: NO_VIEWS_LEFT, message: 'This video has no views left. You can ask your centre for another.', details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }

