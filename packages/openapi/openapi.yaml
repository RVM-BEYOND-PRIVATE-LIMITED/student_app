      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /batches:
    get:
      parameters:
        - schema:
            type: string
            format: uuid
          in: query
          name: course_id
          required: false
        - schema:
            type: string
          in: query
          name: centre_id
          required: false
        - schema:
            type: string
          in: query
          name: schedule
          required: false
      responses:
        "200":
          description: Default Response
  /batches/detail:
    get:
      responses:
        "200":
          description: Default Response
  /pricing/quote:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      team_course_id:
                        type: string
                        format: uuid
                      team_batch_id:
                        type: string
                        format: uuid
                      list_paise:
                        type: integer
                        minimum: 0
                    required:
                      - team_course_id
                      - team_batch_id
                      - list_paise
                    additionalProperties: false
                  minItems: 1
                  maxItems: 10
                fee_plan:
                  type: string
                  enum:
                    - one_time
                    - three_instalments
              required:
                - items
                - fee_plan
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  subtotal_paise:
                    type: integer
                    minimum: 0
                  discount_paise:
                    type: integer
                    minimum: 0
                  total_paise:
                    type: integer
                    minimum: 0
                  seat_fee_paise:
                    type: integer
                    minimum: 0
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        team_course_id:
                          type: string
                          format: uuid
                        team_batch_id:
                          type: string
                          format: uuid
                        list_paise:
                          type: integer
                          minimum: 0
                        discount_paise:
                          type: integer
                          minimum: 0
                        net_paise:
                          type: integer
                          minimum: 0
                      required:
                        - team_course_id
                        - team_batch_id
                        - list_paise
                        - discount_paise
                        - net_paise
                      additionalProperties: false
                  price_snapshot:
                    type: object
                    additionalProperties: {}
                required:
                  - subtotal_paise
                  - discount_paise
                  - total_paise
                  - seat_fee_paise
                  - items
                  - price_snapshot
                additionalProperties: false
  /bookings:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      team_course_id:
                        type: string
                        format: uuid
                      team_batch_id:
                        type: string
                        format: uuid
                      list_paise:
                        type: integer
                        minimum: 0
                    required:
                      - team_course_id
                      - team_batch_id
                      - list_paise
                    additionalProperties: false
                  minItems: 1
                  maxItems: 10
                fee_plan:
                  type: string
                  enum:
                    - one_time
                    - three_instalments
              required:
                - items
                - fee_plan
              additionalProperties: false
      responses:
        "200":
          description: Default Response
  /bookings/{id}:
