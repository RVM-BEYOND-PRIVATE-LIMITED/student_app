      operationId: chooseBatch
      summary: Take a seat in a batch
      description: |
        One batch per course. Two students taking the last seat together: one gets 409
        `BATCH_FULL`. No seat is held. Joined stays for the centre to tick. 202 while joining is in
        its trial (the choice is recorded but no seat is taken yet).
      x-status: live
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchChoice' }
            examples:
              one: { value: { batch_id: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d, course_id: 3c2b1a09-8f7e-4d6c-9b5a-4f3e2d1c0b9a } }
      responses:
        '201':
          description: The seat is taken.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchChosen' }
              examples:
