      summary: Send proof of a job
      description: |
        multipart/form-data: `company_name`, `role`, `salary_paise` (monthly), `joining_date` and `file`
        (the offer or joining letter: JPEG, PNG or PDF, at most 5 MB). All are required. The placement
        team verifies it within 14 days. For a student linked to an admission.
      x-status: live
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [company_name, role, salary_paise, joining_date, file]
              properties:
                company_name: { type: string, minLength: 2, maxLength: 200 }
                role: { type: string, minLength: 2, maxLength: 120 }
                salary_paise: { type: integer, minimum: 1 }
                joining_date: { type: string, format: date }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Sent.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementProofCreated' }
              examples:
                one: { value: { id: 8c9d0e1f-2a3b-4c4d-9e5f-7a8b9c0d1e2f, status: submitted, joined_selection: true } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/me/payout-account:
    get:
      tags: [rewards]
      operationId: getPayoutAccount
      summary: Where my rewards go
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutAccountReply' }
              examples:
                one: { value: { account: { kind: upi, holder_name: Asha Verma, last4: 'asha', status: pending, verified_at: null } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [rewards]
      operationId: setPayoutAccount
      summary: Set my UPI ID or bank account
      description: |
        Only the holder name and the last 4 characters are kept. While rewards are a dry run the account
        is kept `pending` and nothing is checked. Once rewards are live it is checked with RazorpayX first
        and saved only when the check passes (`status: verified`, or `pending` while the check is still
        running); an account that fails the check is not saved and an earlier verified one stays.
        Checks are capped per account and per day.
      x-status: live
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAccountSet' }
            examples:
              upi: { value: { kind: upi, upi_id: asha@okaxis, holder_name: Asha Verma } }
      responses:
        '200':
          description: Saved; waiting to be verified.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutAccountReply' }
              examples:
                one: { value: { account: { kind: upi, holder_name: Asha Verma, last4: 'asha', status: pending, verified_at: null } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The UPI ID or bank account did not pass the check. Nothing was saved.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid: { value: { code: ACCOUNT_INVALID, message: 'This UPI ID or bank account could not be verified. Check it and try again.', details: {}, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '429':
          description: Too many account checks today (`CHECKS_CAPPED`), or too many requests.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                capped: { value: { code: CHECKS_CAPPED, message: 'Too many account checks today. Try again tomorrow.', details: {}, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }

