          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizResult' }
              examples:
                one: { value: { score: 1, max_score: 1, late: false, answers: { 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d: a } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 'NO_QUIZ_TODAY.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: NO_QUIZ_TODAY, message: "There is no quiz today.", details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '409':
          description: 'ALREADY_ANSWERED: one attempt a day.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: ALREADY_ANSWERED, message: "You already answered today's quiz.", details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '403':
          description: 'NOT_ELIGIBLE: interview prep opens once the student is registered (or an alumnus).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: NOT_ELIGIBLE, message: "Interview prep opens once you are a registered student.", details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/quizzes/mock/roles:
    get:
      tags: [learning]
      operationId: listMockRoles
      summary: Roles with a mock quiz
      description: |
        The job roles I can take a timed mock quiz for.
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockRoles' }
              examples:
                one: { value: { roles: [{ id: 2b3c4d5e-6f70-4a8b-9c0d-1e2f3a4b5c6d, name: CNC Programmer }] } }
        '403':
          description: 'NOT_ELIGIBLE: interview prep opens once the student is registered (or an alumnus).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: NOT_ELIGIBLE, message: "Interview prep opens once you are a registered student.", details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/quizzes/mock/attempts:
    post:
      tags: [learning]
      operationId: startMockQuiz
      summary: Start a mock quiz
      description: |
        The server picks the role's questions and sets a deadline. No right answers are sent.
      x-status: live
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockStart' }
            examples:
              one: { value: { role_id: 2b3c4d5e-6f70-4a8b-9c0d-1e2f3a4b5c6d } }
      responses:
        '201':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockStarted' }
              examples:
                one: { value: { attempt_id: 4d5e6f70-8192-4a0b-9c1d-2e3f4a5b6c7d, deadline_at: '2026-11-15T10:15:00.000Z', questions: [{ id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, prompt: 'Which view shows the top of a part?', options: [{ key: a, text: Plan }, { key: b, text: Elevation }] }] } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          description: 'NOT_ELIGIBLE: interview prep opens once the student is registered (or an alumnus).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: NOT_ELIGIBLE, message: "Interview prep opens once you are a registered student.", details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/quizzes/attempts/{id}/submit:
    post:
      tags: [learning]
      operationId: submitMockQuiz
      summary: Submit a mock quiz
      description: |
        My score and the right answers. Answers sent after the deadline count nothing (`late: true`).
      x-status: live
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizAnswers' }
            examples:
              one: { value: { answers: { 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d: b } } }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizResult' }
              examples:
                one: { value: { score: 0, max_score: 1, late: false, answers: { 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d: a } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'ALREADY_SUBMITTED.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: ALREADY_SUBMITTED, message: "This quiz was already submitted.", details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '403':
          description: 'NOT_ELIGIBLE: interview prep opens once the student is registered (or an alumnus).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                one: { value: { code: NOT_ELIGIBLE, message: "Interview prep opens once you are a registered student.", details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/me/online-classes:
    get:
      tags: [classes]
      operationId: listMyOnlineClasses
      summary: My online classes
      description: |
        The classes of my online or hybrid batches for the next 14 days. `can_join` is true only for a
        scheduled class of a batch I am on, when I am not on fee hold; otherwise `reason` says why
        (`fee_hold`, `cancelled`, `not_ready`) and there is no link.
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineClasses' }
              examples:
                one: { value: { classes: [{ id: 5e6f7081-92a3-4b4c-8d5e-6f708192a3b4, batch_id: 6f708192-a3b4-4c5d-9e6f-708192a3b4c5, batch_name: 'CAD Mon-Wed-Fri', date: '2026-11-16', start: '10:00', end: '12:00', status: scheduled, can_join: true, reason: null, link: 'https://meet.example.org/abc-defg-hij' }] } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    studentBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from sign-in or refresh. It lives 15 minutes.

  headers:
    X-Request-Id:
      description: The id of this request. Quote it when reporting a problem.
      schema: { type: string }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A new random value for each action (a UUID is fine), reused only to retry that same action.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,255}$' }
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: The app's version, for example 1.2.0. The web version sends none.
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request is not valid. `details.issues` names each problem.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            validation: { $ref: '#/components/examples/ErrorValidation' }
            key_missing: { $ref: '#/components/examples/ErrorKeyMissing' }
    Unauthenticated:
      description: No valid student token.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unauthenticated: { $ref: '#/components/examples/ErrorUnauthenticated' }
    Forbidden:
      description: Signed in, but this is not open to the student yet.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            onboarding: { $ref: '#/components/examples/ErrorOnboarding' }
            blocked: { $ref: '#/components/examples/ErrorAccountBlocked' }
            stage_required: { $ref: '#/components/examples/ErrorStageRequired' }
            jobs_closed: { $ref: '#/components/examples/ErrorJobsClosed' }
    NotFound:
      description: Nothing here.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            not_found: { $ref: '#/components/examples/ErrorNotFound' }
    Conflict:
      description: The action clashes with what is already there, or the key was reused.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            device_change: { $ref: '#/components/examples/ErrorDeviceChange' }
            key_reused: { $ref: '#/components/examples/ErrorKeyReused' }
    AnswerConflict:
      description: Already answered or expired, or the key was reused.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            already_answered: { $ref: '#/components/examples/ErrorAlreadyAnswered' }
            key_reused: { $ref: '#/components/examples/ErrorKeyReused' }
    RegistrationConflict:
      description: Already admitted, a registration already open or submitted, or the video ended too soon.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            already_admitted: { value: { code: ALREADY_ADMITTED, message: You already have an admission., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
            open: { value: { code: REGISTRATION_OPEN, message: You already have a registration in progress., details: { id: 2e1d0c9b-8a7f-4e5d-9c3b-2a1908f7e6d5 }, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
            too_soon: { value: { code: VIDEO_TOO_SOON, message: Watch the whole video first., details: { seconds_left: 120 }, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
    BatchConflict:
      description: The batch filled up, a batch was already chosen for the course, or the key was reused.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            full: { value: { code: BATCH_FULL, message: That batch has just filled up. Choose another., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
            chosen: { value: { code: ALREADY_CHOSEN, message: You already chose a batch for this course., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
    CorrectionConflict:
      description: Too old, not a missed class, already asked, or the key was reused.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            too_old: { value: { code: CORRECTION_TOO_OLD, message: Corrections can be asked for the last 7 days only., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
            open: { value: { code: CORRECTION_OPEN, message: You already asked about this class., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
    ComplaintConflict:
      description: Not linked yet, too many open, resolved (reopen it first), not resolved, the reopen window has passed, or the key was reused.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            not_linked: { value: { code: NOT_LINKED, message: Link your account to your admission first., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
            too_many: { value: { code: TOO_MANY_OPEN, message: You have 5 open complaints. Wait for an answer before raising another., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
            resolved: { value: { code: COMPLAINT_RESOLVED, message: This complaint is resolved. Reopen it to write again., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
            window: { value: { code: REOPEN_WINDOW_PASSED, message: A complaint can be reopened within 7 days of being resolved. Raise a new one., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
    ContentBlocked:
      description: |
        The text holds a phone number, a run of 10 or more digits, a UPI ID or a request for money.
        Nothing was stored. `details.reason` is `phone`, `digits`, `upi` or `money`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            phone: { value: { code: CONTENT_BLOCKED, message: 'Phone numbers, payment IDs and requests for money are not allowed here.', details: { reason: phone }, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
    CommunityConflict:
      description: Already voted, already reported, your own post, not hidden, or the key was reused.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            voted: { value: { code: ALREADY_VOTED, message: You already voted in this poll., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
            reported: { value: { code: ALREADY_REPORTED, message: You already reported this post., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
    RegistrationIncomplete:
      description: Something is still missing.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing: { value: { code: REGISTRATION_INCOMPLETE, message: Some parts are still missing., details: { missing: [video, id_document] }, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
    ConsentConflict:
      description: The text version sent is not the current one, or the key was reused.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            text_outdated: { $ref: '#/components/examples/ErrorConsentOutdated' }
            key_reused: { $ref: '#/components/examples/ErrorKeyReused' }
    IdempotencyConflict:
      description: The Idempotency-Key was used with another body, or its first use is still running.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            key_reused: { $ref: '#/components/examples/ErrorKeyReused' }
            in_progress: { $ref: '#/components/examples/ErrorKeyInProgress' }
    UpgradeRequired:
      description: This app version is too old. Show the update screen with `details.store_url`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            upgrade: { $ref: '#/components/examples/ErrorUpgrade' }
    RateLimited:
      description: Too many requests. Wait `details.retry_after` seconds.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            rate_limited: { $ref: '#/components/examples/ErrorRateLimited' }
    Unavailable:
      description: The app is not open to this student yet, or the service is in maintenance.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            module_off: { $ref: '#/components/examples/ErrorModuleOff' }
            maintenance: { $ref: '#/components/examples/ErrorMaintenance' }

  schemas:
    ThemePreference:
      type: object
      required: [theme, theme_open]
      additionalProperties: false
      properties:
        theme: { type: string, enum: [light, dark, system], default: light }
        theme_open: { type: boolean }
    ThemeChoice:
      type: object
      required: [theme]
      additionalProperties: false
      properties:
        theme: { type: string, enum: [light, dark, system] }
    Error:
      type: object
      required: [code, message, details, request_id]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            What the app branches on. One of: VALIDATION_FAILED, IDEMPOTENCY_KEY_REQUIRED,
            IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS, UNAUTHENTICATED,
            CODE_WRONG, CODE_EXPIRED, ONBOARDING_INCOMPLETE, ACCOUNT_BLOCKED, STAGE_REQUIRED, JOBS_CLOSED,
            NOT_FOUND, DEVICE_CHANGE_NEEDS_CENTRE, PHONE_INVALID, RESEND_USED, RESEND_TOO_SOON,
            OTP_UNAVAILABLE, LINK_REQUEST_OPEN, ALREADY_ANSWERED, ALREADY_ADMITTED, REGISTRATION_OPEN,
            REGISTRATION_SUBMITTED, REGISTRATION_INCOMPLETE, VIDEO_NOT_STARTED, VIDEO_TOO_SOON, BATCH_FULL,
            ALREADY_CHOSEN, FEE_HOLD, CORRECTION_TOO_OLD, NOT_A_SESSION, CORRECTION_OPEN,
            CONSENT_TEXT_OUTDATED, UPGRADE_REQUIRED, RATE_LIMITED, MODULE_OFF, MAINTENANCE,
            NOT_READY, INTERNAL.
          pattern: '^[A-Z][A-Z0-9_]+$'
        message: { type: string }
        details:
          description: Extra facts for some codes, otherwise null.
          oneOf:
            - type: 'null'
            - type: object
        request_id: { type: string }

    Config:
      type: object
      required: [min_supported_version, latest_version, store_url, maintenance, jobs_header]
      additionalProperties: false
      properties:
        min_supported_version: { $ref: '#/components/schemas/Version' }
        latest_version: { $ref: '#/components/schemas/Version' }
        store_url:
          description: Where the update button goes. Null until the app is in a store.
          oneOf:
            - type: 'null'
            - type: string
              format: uri
        maintenance:
          type: object
          required: [active, message]
          additionalProperties: false
          properties:
            active: { type: boolean }
            message:
              oneOf:
                - type: 'null'
                - type: string
        jobs_header: { $ref: '#/components/schemas/JobsHeader' }

    JobsHeader:
      type: object
      description: The strip above the Jobs tab web view, set on the server.
      required: [title, subtitle, logos]
      additionalProperties: false
      properties:
        title: { type: string }
        subtitle:
          oneOf:
            - type: 'null'
            - type: string
        logos:
          type: array
          items:
            type: object
            required: [key, url]
            additionalProperties: false
            properties:
              key: { type: string, enum: [rvm, campus] }
              url: { type: string, format: uri }

    Version:
      type: string
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'

    OtpRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: An Indian mobile number. Spaces, dashes and a leading +91 or 0 are removed; what is left must be 10 digits starting with 6 to 9.

    OtpResend:
      type: object
      required: [challenge_id]
      additionalProperties: false
      properties:
        challenge_id: { type: string, format: uuid }

    OtpChallenge:
      type: object
      required: [challenge_id, channel, expires_at, resend_available_at]
      additionalProperties: false
      properties:
        challenge_id: { type: string, format: uuid }
        channel: { type: string, enum: [whatsapp, sms] }
        expires_at: { type: string, format: date-time }
        resend_available_at:
          description: When the SMS resend opens. Null once it has been used.
          oneOf:
            - type: 'null'
            - type: string
              format: date-time

    Device:
      type: object
      required: [install_id, platform]
      additionalProperties: false
      properties:
        install_id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios, web] }
        app_version: { $ref: '#/components/schemas/Version' }

    OtpVerify:
      type: object
      required: [challenge_id, code, device]
      additionalProperties: false
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }
        device: { $ref: '#/components/schemas/Device' }

    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string, minLength: 20 }
        install_id: { type: string, format: uuid }

    TokenPair:
      type: object
      required: [token_type, access_token, access_expires_at, session_id]
      additionalProperties: false
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token:
          type: string
          description: App only. The web version receives it as a cookie instead.
        refresh_expires_at: { type: string, format: date-time }
        session_id: { type: string, format: uuid }

    SignedIn:
      type: object
      required: [tokens, account, created]
      additionalProperties: false
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
        account: { $ref: '#/components/schemas/Me' }
        created: { type: boolean, description: True when this sign-in made the account. }

    Me:
      type: object
      required: [id, phone_masked, language, stage, fee_fully_paid, is_alumni, link_state, onboarding, counts]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The student's account id. The same id is the student's reference on Campus.
        phone_masked: { type: string, description: 'The bound phone, for example ••••••0000.' }
        language: { type: string, enum: [en, hi] }
        stage: { $ref: '#/components/schemas/Stage' }
        fee_fully_paid: { type: boolean }
        is_alumni: { type: boolean }
        link_state: { type: string, enum: [unlinked, requested, linked] }
        onboarding:
          type: object
          required: [age_confirmed, required_consent_given]
          additionalProperties: false
          properties:
            age_confirmed: { type: boolean }
            required_consent_given: { type: boolean }
        counts:
          type: object
          required: [placement_prompts, consent_requests]
          additionalProperties: false
          properties:
            placement_prompts: { type: integer, minimum: 0 }
            consent_requests: { type: integer, minimum: 0 }

    Stage:
      type: string
      enum: [visitor, registered, fully_paid, alumni]
      description: |
        visitor: not linked to an admission. registered: linked, fees still due. fully_paid: the
        whole fee is paid. alumni: the course has ended; an alumnus with dues still has
        `fee_fully_paid: false`.

    LanguageChoice:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language: { type: string, enum: [en, hi] }

    Session:
      type: object
      required: [id, client_kind, platform, created_at, last_used_at, current]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        client_kind: { type: string, enum: [app, web] }
        platform: { type: string, enum: [android, ios, web] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        current: { type: boolean }

    Branch:
      type: object
      required: [id, name, call_number]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        call_number:
          description: The centre's public number, or null while it is not set.
          oneOf:
            - type: 'null'
            - type: string

    LinkRequest:
      type: object
      required: [branch_id, name]
      additionalProperties: false
      properties:
        branch_id: { type: integer }
        name: { type: string, minLength: 2, maxLength: 120 }
        admission_number: { type: string, maxLength: 40 }

    LinkResult:
      type: object
      required: [state, account]
      additionalProperties: false
      properties:
        state: { type: string, enum: [linked, needs_centre, requested] }
        account: { $ref: '#/components/schemas/Me' }

    Admission:
      type: object
      required: [admission_number, name, courses, branch, paid_figures, total_fees_paise, remaining_due_paise, plan]
      additionalProperties: false
      properties:
        admission_number: { type: string }
        name: { type: string }
        courses: { type: array, items: { type: string } }
        branch:
          type: object
          required: [id, name]
          additionalProperties: false
          properties:
            id: { type: integer }
            name: { type: string }
        paid_figures: { type: string, enum: [current, legacy] }
        total_fees_paise: { type: integer, minimum: 0 }
        total_paid_paise: { type: integer, minimum: 0, description: Absent when paid_figures is legacy. }
        remaining_due_paise: { type: integer, minimum: 0 }
        plan:
          type: array
          items:
            type: object
            required: [due_date, amount_paise, balance_due_paise, status]
            additionalProperties: false
            properties:
              due_date: { type: string, format: date }
              amount_paise: { type: integer, minimum: 0 }
              balance_due_paise: { type: integer, minimum: 0 }
              status: { type: string, enum: [paid, pending, overdue] }

    ConsentPurpose:
      type: string
      enum: [share_profile, marketing_story]
      description: share_profile is required for Jobs; marketing_story is optional.

    ConsentText:
      type: object
      required: [purpose, version, language, text, required]
      additionalProperties: false
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        version: { type: integer, minimum: 1 }
        language: { type: string, enum: [en, hi] }
        text: { type: string }
        required: { type: boolean }

    Consents:
      type: object
      required: [consents]
      additionalProperties: false
      properties:
        consents:
          type: array
          items:
            type: object
            required: [purpose, granted, text_version, granted_at, withdrawn_at]
            additionalProperties: false
            properties:
              purpose: { $ref: '#/components/schemas/ConsentPurpose' }
              granted: { type: boolean }
              text_version:
                oneOf:
                  - type: 'null'
                  - type: integer
              granted_at:
                oneOf:
                  - type: 'null'
                  - type: string
                    format: date-time
              withdrawn_at:
                oneOf:
                  - type: 'null'
                  - type: string
                    format: date-time

    ConsentChoice:
      type: object
      required: [share_profile, marketing_story, text_versions]
      additionalProperties: false
      properties:
        share_profile: { type: boolean }
        marketing_story: { type: boolean }
        text_versions:
          type: object
          required: [share_profile, marketing_story]
          additionalProperties: false
          properties:
            share_profile: { type: integer, minimum: 1 }
            marketing_story: { type: integer, minimum: 1 }

    JobsReason:
      type: string
      enum: [not_linked, fee_pending, consent_missing, age_not_confirmed, account_blocked, not_open_yet]

    JobsAccess:
      type: object
      required: [allowed, reason, reasons, stage, checked_at]
      additionalProperties: false
      properties:
        allowed: { type: boolean }
        reason:
          description: The first of `reasons`, or null when allowed.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JobsReason'
        reasons:
          type: array
          items: { $ref: '#/components/schemas/JobsReason' }
        stage: { $ref: '#/components/schemas/Stage' }
        checked_at: { type: string, format: date-time }

    CampusHandoff:
      type: object
      required: [url, expires_at]
      additionalProperties: false
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    Course:
      type: object
      required: [id, name, price_paise]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price_paise: { type: integer, minimum: 0 }

    Undertaking:
      type: object
      required: [version, video, terms]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        video:
          type: object
          required: [youtube_id, seconds]
          additionalProperties: false
          properties:
            youtube_id: { type: string }
            seconds:
              oneOf:
                - type: 'null'
                - type: integer
        terms:
          type: array
          items:
            type: object
            required: [key, text, required]
            additionalProperties: false
            properties:
              key: { type: string }
              text: { type: string }
              required: { type: boolean }

    Ok:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean }

    NotificationList:
      type: object
      required: [unread, notifications]
      additionalProperties: false
      properties:
        unread: { type: integer, minimum: 0 }
        notifications:
          type: array
          items:
            type: object
            required: [id, category, title, body, route, created_at, read]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              category: { type: string, enum: [classes, fees, complaints, community, placement, account] }
              title: { type: string }
              body: { type: string }
              route: { oneOf: [{ type: 'null' }, { type: string }] }
              created_at: { type: string, format: date-time }
              read: { type: boolean }

    AnnouncementList:
      type: object
      required: [announcements]
      additionalProperties: false
      properties:
        announcements:
          type: array
          items:
            type: object
            required: [id, title, message, scope, batch_id, created_at]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              message: { type: string }
              scope: { type: string, enum: [all, batch] }
              batch_id: { oneOf: [{ type: 'null' }, { type: string, format: uuid }] }
              created_at: { type: string, format: date-time }

    ClassItem:
      type: object
      required: [date, batch_id, start_time, end_time, faculty_name, courses]
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        batch_id: { type: string, format: uuid }
        start_time: { oneOf: [{ type: 'null' }, { type: string }] }
        end_time: { oneOf: [{ type: 'null' }, { type: string }] }
        faculty_name: { oneOf: [{ type: 'null' }, { type: string }] }
        courses: { type: array, items: { type: string } }

    Timetable:
      type: object
      required: [from, to, classes]
      additionalProperties: false
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        classes: { type: array, items: { $ref: '#/components/schemas/ClassItem' } }

    Today:
      type: object
      required: [date, classes, fee_hold]
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        classes: { type: array, items: { $ref: '#/components/schemas/ClassItem' } }
        fee_hold:
          type: object
          required: [on_hold, since]
          additionalProperties: false
          properties:
            on_hold: { type: boolean }
            since: { oneOf: [{ type: 'null' }, { type: string, format: date }] }

    AttendanceSummary:
      type: object
      required: [present, marked, percent]
      properties:
        batch_id: { type: string, format: uuid }
        present: { type: integer, minimum: 0 }
        marked: { type: integer, minimum: 0 }
        percent: { oneOf: [{ type: 'null' }, { type: number }] }

    Attendance:
      type: object
      required: [from, to, overall, batches, sessions]
      additionalProperties: false
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        overall: { $ref: '#/components/schemas/AttendanceSummary' }
        batches: { type: array, items: { $ref: '#/components/schemas/AttendanceSummary' } }
        sessions:
          type: array
          items:
            type: object
            required: [date, batch_id, state]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              batch_id: { type: string, format: uuid }
              state: { type: string, enum: [present, absent, not_marked, not_counted] }

    CorrectionRequest:
      type: object
      required: [batch_id, date, reason]
      additionalProperties: false
      properties:
        batch_id: { type: string, format: uuid }
        date: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 500 }

    Correction:
      type: object
      required: [id, batch_id, date, reason, status, created_at, decided_at, note]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        date: { type: string, format: date }
        reason: { type: string }
        status: { type: string, enum: [open, approved, rejected] }
        created_at: { type: string, format: date-time }
        decided_at: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        note: { oneOf: [{ type: 'null' }, { type: string }] }

    CorrectionList:
      type: object
      required: [requests]
      additionalProperties: false
      properties:
        requests: { type: array, items: { $ref: '#/components/schemas/Correction' } }

    ComplaintCategory:
      type: object
      required: [slug, name, goes_to, confidential]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: '^[a-z][a-z_]{1,39}$' }
        name: { type: string }
        goes_to: { type: string, enum: [centre, head_of_operations, hr] }
        confidential: { type: boolean }

    ComplaintCategoryList:
      type: object
      required: [categories]
      additionalProperties: false
      properties:
        categories: { type: array, items: { $ref: '#/components/schemas/ComplaintCategory' } }

    ComplaintRaise:
      type: object
      required: [category, description]
      additionalProperties: false
      properties:
        category: { type: string, pattern: '^[a-z][a-z_]{1,39}$' }
        description: { type: string, minLength: 10, maxLength: 2000 }

    Complaint:
      type: object
      required: [id, ref, category, category_name, status, description, created_at, reply_due_at, resolve_due_at, answered, resolved_at, reopen_until, can_reopen, reopen_count, last_activity_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        ref: { type: string, description: 'Quote it to the centre, for example C-2612-00012.' }
        category: { type: string }
        category_name: { type: string }
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        description: { type: string }
        created_at: { type: string, format: date-time }
        reply_due_at: { type: string, format: date-time, description: When the centre should have replied. }
        resolve_due_at: { type: string, format: date-time, description: When it should be resolved; after this it goes to the Head of Operations. }
        answered: { type: boolean, description: Whether staff have replied. }
        resolved_at: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        reopen_until: { oneOf: [{ type: 'null' }, { type: string, format: date-time }], description: Resolved or closed only. }
        can_reopen: { type: boolean }
        reopen_count: { type: integer, minimum: 0 }
        last_activity_at: { type: string, format: date-time }

    ComplaintList:
      type: object
      required: [complaints]
      additionalProperties: false
      properties:
        complaints: { type: array, items: { $ref: '#/components/schemas/Complaint' } }

    ComplaintMessage:
      type: object
      required: [id, author, body, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        author: { type: string, enum: [student, staff] }
        body: { type: string }
        created_at: { type: string, format: date-time }

    ComplaintThread:
      type: object
      required: [complaint, messages]
      additionalProperties: false
      properties:
        complaint: { $ref: '#/components/schemas/Complaint' }
        messages: { type: array, items: { $ref: '#/components/schemas/ComplaintMessage' } }

    ComplaintMessageBody:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }

    ComplaintReopen:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 2000 }

    CommunityGroup:
      type: object
      required: [id, kind, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [general, course, branch] }
        name: { type: string }

    CommunityGroupList:
      type: object
      required: [groups]
      additionalProperties: false
      properties:
        groups: { type: array, items: { $ref: '#/components/schemas/CommunityGroup' } }

    CommunityPollOption:
      type: object
      required: [id, label, vote_count]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        vote_count: { type: integer, minimum: 0 }

    CommunityPoll:
      type: object
      required: [vote_count, my_vote, options]
      additionalProperties: false
      properties:
        vote_count: { type: integer, minimum: 0 }
        my_vote: { oneOf: [{ type: 'null' }, { type: string, format: uuid }] }
        options: { type: array, items: { $ref: '#/components/schemas/CommunityPollOption' } }

    CommunityPost:
      type: object
      required: [id, group_id, author, mine, body, created_at, comment_count, reaction_count, reacted, hidden, poll]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        author: { type: string, description: 'First name, course and branch; never a phone number.' }
        mine: { type: boolean }
        body: { type: string }
        created_at: { type: string, format: date-time }
        comment_count: { type: integer, minimum: 0 }
        reaction_count: { type: integer, minimum: 0 }
        reacted: { type: boolean }
        hidden: { type: boolean, description: 'Only moderators ever see a hidden post.' }
        poll: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/CommunityPoll' }] }

    CommunityFeed:
      type: object
      required: [posts, next]
      additionalProperties: false
      properties:
        posts: { type: array, items: { $ref: '#/components/schemas/CommunityPost' } }
        next: { oneOf: [{ type: 'null' }, { type: string }] }

    CommunityPostCreate:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        poll_options: { type: array, minItems: 2, maxItems: 6, items: { type: string, minLength: 1, maxLength: 120 } }

    CommunityComment:
      type: object
      required: [id, author, mine, body, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        author: { type: string }
        mine: { type: boolean }
        body: { type: string }
        created_at: { type: string, format: date-time }

    CommunityCommentList:
      type: object
      required: [comments]
      additionalProperties: false
      properties:
        comments: { type: array, items: { $ref: '#/components/schemas/CommunityComment' } }

    CommunityCommentCreate:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }

    CommunityCommentCreated:
      type: object
      required: [id, mine, body, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        mine: { type: boolean }
        body: { type: string }
        created_at: { type: string, format: date-time }

    CommunityReaction:
      type: object
      required: [reacted, reaction_count]
      additionalProperties: false
      properties:
        reacted: { type: boolean }
        reaction_count: { type: integer, minimum: 0 }

    CommunityVote:
      type: object
      required: [option_id]
      additionalProperties: false
      properties:
        option_id: { type: string, format: uuid }

    CommunityReportCreate:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 300 }

    CommunityReported:
      type: object
      required: [id, hidden]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        hidden: { type: boolean }

    CommunityReportQueue:
      type: object
      required: [reports]
      additionalProperties: false
      properties:
        reports:
          type: array
          items:
            type: object
            required: [post_id, group_id, group_name, author, author_account_id, body, created_at, hidden, report_count, reasons, first_reported_at]
            additionalProperties: false
            properties:
              post_id: { type: string, format: uuid }
              group_id: { type: string, format: uuid }
              group_name: { type: string }
              author: { type: string }
              author_account_id: { oneOf: [{ type: 'null' }, { type: string, format: uuid }] }
              body: { type: string }
              created_at: { type: string, format: date-time }
              hidden: { type: boolean }
              report_count: { type: integer, minimum: 1 }
              reasons: { type: array, items: { type: string } }
              first_reported_at: { type: string, format: date-time }

    CommunityHide:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }

    CommunityRestore:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 300 }

    CommunityModerated:
      type: object
      required: [id, hidden]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        hidden: { type: boolean }

    CommunityWarn:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        post_id: { type: string, format: uuid }

    CommunityWarned:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }

    PublicCourseList:
      type: object
      required: [courses]
      additionalProperties: false
      properties:
        courses:
          type: array
          items:
            type: object
            required: [id, name, price_paise, summary, duration, next_batches]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              price_paise: { type: integer, minimum: 0 }
              summary: { oneOf: [{ type: 'null' }, { type: string }] }
              duration: { oneOf: [{ type: 'null' }, { type: string }] }
              next_batches:
                type: array
                items:
                  type: object
                  required: [branch_id, branch, start_date, days, start_time, end_time]
                  additionalProperties: false
                  properties:
                    branch_id: { type: integer }
                    branch: { oneOf: [{ type: 'null' }, { type: string }] }
                    start_date: { type: string, format: date }
                    days: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
                    start_time: { oneOf: [{ type: 'null' }, { type: string }] }
                    end_time: { oneOf: [{ type: 'null' }, { type: string }] }

    PublicBranchList:
      type: object
      required: [branches]
      additionalProperties: false
      properties:
        branches:
          type: array
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id: { type: integer }
              name: { type: string }

    EnquiryCreate:
      type: object
      required: [name, phone, form_type]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 10, maxLength: 20, description: 'Any spacing, with or without +91.' }
