openapi: 3.0.3
info:
  title: RVM Student App API
  version: 1.0.0
components:
  schemas: {}
paths:
  /health:
    get:
      responses:
        "200":
          description: Default Response
  /ready:
    get:
      responses:
        "200":
          description: Default Response
  /config:
    get:
      responses:
        "200":
          description: Default Response
  /auth/otp/request:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_e164:
                  type: string
                  pattern: ^\+\d{7,15}$
              required:
                - phone_e164
              additionalProperties: false
      responses:
        "200":
          description: Default Response
  /auth/otp/verify:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_e164:
                  type: string
                  pattern: ^\+\d{7,15}$
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
              required:
                - phone_e164
                - code
              additionalProperties: false
      responses:
        "200":
          description: Default Response
  /auth/refresh:
    post:
      responses:
        "200":
          description: Default Response
  /auth/logout:
    post:
      responses:
        "200":
          description: Default Response
  /auth/device/rebind:
