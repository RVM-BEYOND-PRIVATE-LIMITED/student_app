  /v1/public/enquiries:
    post:
      tags: [public]
      operationId: createEnquiry
      summary: An enquiry from the website or the app (no sign-in)
      description: |
        Stored first, then delivered to the CRM (one lead per phone: created or merged, with the
        page, form type and UTM fields). 202 means it is stored. The same phone, form type and page
        again within 10 minutes is the same enquiry. 5 an hour per phone, 20 per address.
        Form type `company` (a company that wants to hire) goes to the placement team, never the CRM.
        Each form type opens on its own (switch `website_enquiries`, then the setting's list of open
        forms); a closed one answers 503 `MODULE_OFF`. Leave `company_website` out: it is a trap field for bots.
      x-status: live
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnquiryCreate' }
            examples:
              one: { value: { name: Asha Verma, phone: '9876543210', form_type: counselling, course_id: 0b9d7a6e-3c1f-4e2a-9b8c-7d6e5f4a3b2c, location_id: 1, page: /pricing, utm_source: google, utm_campaign: winter, consent: true } }
      responses:
        '202':
          description: Stored.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnquiryReceived' }
              examples:
                one: { value: { id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f, status: received } }
        '400':
          description: Not valid, or the phone is not a ten-digit Indian mobile (`PHONE_INVALID`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                phone: { value: { code: PHONE_INVALID, message: Enter a ten-digit Indian mobile number., details: null, request_id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
