  /v1/me/payment-orders:
    post:
      tags: [payments]
      operationId: createPaymentOrder
      summary: Start a payment
      description: |
        The server decides every amount: a joining payment from Rs 1,000 to the course fee; an
        instalment is the balance due up to `due_date` (any amount sent is ignored); `balance` is
        everything still due. The non-refundable tick of the current text version is required.
        Until payments go live the order is a dry run: `mode: dry_run` and `checkout: null`, and no
        money can be taken. A live order's `checkout` opens Razorpay; only the signed webhook makes
        the receipt.
      x-status: live
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentOrderCreate' }
            examples:
              one: { value: { purpose: instalment, due_date: '2026-12-05', accept_non_refundable: true, text_version: 1 } }
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderCreated' }
              examples:
                dry_run: { value: { id: 6a7b8c9d-0e1f-4a2b-9c3d-5e6f7a8b9c0d, purpose: instalment, amount_paise: 450000, mode: dry_run, status: created, checkout: null } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '502': { $ref: '#/components/responses/Unavailable' }
        '503': { $ref: '#/components/responses/Unavailable' }

